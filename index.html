<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Font Thumbnail Generator</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="app-header">
        <div class="header-content">
            <div class="header-top">
                <div class="title-area">
                    <h1>Font Thumbnail Generator</h1>
                    <p>Preview and find the perfect font for your project</p>
                </div>
                <div class="actions">
                    <span id="font-count-display" class="font-count hidden">0 fonts loaded</span>
                    <button id="load-system-btn" class="btn primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
                            <path d="M12 12v9"></path>
                            <path d="m8 17 4 4 4-4"></path>
                        </svg>
                        System Fonts
                    </button>
                    <label for="folder-upload" class="btn secondary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z">
                            </path>
                        </svg>
                        From Folder
                    </label>
                    <input type="file" id="folder-upload" webkitdirectory directory multiple hidden>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" class="modern-input" placeholder="Search font..."
                        autocomplete="off">
                </div>

                <div class="toolbar-item expanded">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 7 4 4 20 4 20 7"></polyline>
                        <line x1="9" y1="20" x2="15" y2="20"></line>
                        <line x1="12" y1="4" x2="12" y2="20"></line>
                    </svg>
                    <input type="text" id="sample-text-input" class="modern-input"
                        placeholder="Type custom sample text..." autocomplete="off">
                </div>

                <div class="toolbar-item size-control">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                    <select id="font-size-select" class="modern-select">
                        <option value="20">20px</option>
                        <option value="24">24px</option>
                        <option value="32">32px</option>
                        <option value="40" selected>40px</option>
                        <option value="56">56px</option>
                        <option value="72">72px</option>
                        <option value="96">96px</option>
                    </select>
                </div>
                <div class="toolbar-item bg-control">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <select id="bg-style-select" class="modern-select">
                        <option value="color" selected>Solid Color</option>
                        <option value="image">Unsplash Photo</option>
                    </select>
                </div>

                <div class="toolbar-item filter-control">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    <select id="type-filter" class="modern-select">
                        <option value="all">All Types</option>
                        <option value="sans">Sans-Serif</option>
                        <option value="serif">Serif</option>
                        <option value="mono">Monospace</option>
                        <option value="script">Script</option>
                        <option value="handwriting">Handwriting</option>
                        <option value="display">Display/Other</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Loading fonts...</p>
        </div>
        <div id="error-message" class="hidden error-msg"></div>

        <div id="welcome-state" class="welcome-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; color: var(--accent-color);">
                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
                <path d="M12 12v9"></path>
                <path d="m8 17 4 4 4-4"></path>
            </svg>
            <h2>User Activation Required</h2>
            <p>To preview your local system fonts, your browser requires explicit permission.</p>
            <button id="grant-permission-btn" class="btn primary-btn" style="margin-top: 1.5rem; display: inline-flex;">
                Grant Permission & Load Fonts
            </button>
        </div>

        <div id="font-grid" class="font-grid">
            <!-- Font cards will be injected here -->
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
    </script>
</body>

</html>
